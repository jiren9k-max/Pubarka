<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211314">
  <title>Pub Arka — stvarne fotografije</title>
  <style>
    :root { color-scheme: dark; --bg:#171011; --panel:#24191a; --line:#53383a; --gold:#dcad69; --text:#f7efe4; --muted:#c5b6a7; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(ellipse at 50% -12%,#492b2c 0,var(--bg) 45rem); color:var(--text); font:16px/1.55 system-ui,Segoe UI,sans-serif; }
    main { width:min(1160px,calc(100% - 40px)); margin:0 auto; padding:56px 0 72px; }
    .brand { color:var(--gold); font-size:.78rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:10px 0 12px; font:clamp(2.5rem,7vw,5rem)/.98 Georgia,serif; letter-spacing:-.045em; }
    .intro { max-width:690px; margin:0; color:var(--muted); }
    .note { display:inline-flex; gap:10px; align-items:center; margin:24px 0 36px; padding:9px 14px; border:1px solid var(--line); border-radius:99px; color:#e7d1b4; font-size:.85rem; }
    .dot { width:8px; height:8px; border-radius:50%; background:#a8bc77; box-shadow:0 0 12px #a8bc77; }
    .gallery { display:grid; grid-template-columns:1.15fr .85fr; gap:18px; }
    figure { position:relative; min-width:0; min-height:310px; margin:0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
    figure:first-child { grid-row:span 2; }
    img { display:block; width:100%; height:100%; min-height:310px; object-fit:cover; }
    figure:first-child img { min-height:650px; object-position:center; }
    figcaption { position:absolute; right:0; bottom:0; left:0; padding:48px 20px 18px; background:linear-gradient(transparent,rgba(17,10,11,.9)); }
    figcaption strong { display:block; font:1.25rem Georgia,serif; }
    figcaption span { color:#ead8c0; font-size:.86rem; }
    .actions { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:30px; }
    .button { display:inline-flex; min-height:46px; align-items:center; gap:10px; padding:0 17px; border:1px solid var(--gold); border-radius:99px; background:var(--gold); color:#211314; font-weight:700; text-decoration:none; }
    .social { color:var(--muted); text-decoration-color:#957c68; text-underline-offset:4px; }
    @media(max-width:700px) { main{width:calc(100% - 24px);padding-top:34px}.gallery{grid-template-columns:1fr}.gallery figure:first-child{grid-row:auto}.gallery figure:first-child img{min-height:420px}figure,img{min-height:280px} }
  </style>
</head>
<body>
  <main>
    <p class="brand">Pub Arka · Sarajevo</p>
    <h1>Pravo mjesto.<br><em>Prave fotografije.</em></h1>
    <p class="intro">Za novu verziju stranice koristimo stvarne kadrove sa zvaničnih profila Pub Arke — ulaz u lokal, točeno pivo i večer uz živu muziku.</p>
    <div class="note"><span class="dot" aria-hidden="true"></span>Autentične fotografije Pub Arke</div>
    <section class="gallery" aria-label="Fotografije Pub Arke">
      <figure><img src="assets/images/pubarka-frontage.jpg" alt="Pub Arka noću, prepoznatljivi neonski natpis, bačve i tabla pića ispred ulaza"><figcaption><strong>Vidimo se ispred.</strong><span>Ulaz i izlog Pub Arke u Sarajevu</span></figcaption></figure>
      <figure><img src="assets/images/pubarka-tuborg.jpg" alt="Čaša točenog piva u toplom svjetlu puba"><figcaption><strong>Hladno točeno.</strong><span>Jedno se lako pretvori u još jedno.</span></figcaption></figure>
      <figure><img src="assets/images/pubarka-live-music.jpg" alt="Muzičari nastupaju uživo u Pub Arki"><figcaption><strong>Veče uz muziku.</strong><span>Dobro društvo i živa svirka.</span></figcaption></figure>
    </section>
    <div class="actions"><a class="button" href="index.html">Otvori stranicu Pub Arka <span aria-hidden="true">↗</span></a><a class="social" href="https://www.instagram.com/pub_arka/" target="_blank" rel="noreferrer">Instagram Pub Arke</a></div>
  </main>
</body>
</html>
